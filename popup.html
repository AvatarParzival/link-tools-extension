<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<style>
*{box-sizing:border-box}
body{
    width:380px;
    margin:0;
    padding:22px 20px 18px;
    font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Arial,sans-serif;
    background:#ffffff;
    color:#1e2a3a;
}
.header{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:20px;
}
.logo{
    width:48px;
    height:48px;
    flex:0 0 48px;
    display:flex;
    align-items:center;
    justify-content:center;
}
.logo svg{width:44px;height:44px;display:block}
h1{
    font-size:24px;
    line-height:1.1;
    margin:0;
    font-weight:700;
    letter-spacing:-.3px;
    color:#1e2a3a;
}
.subtitle{
    margin:5px 0 0;
    font-size:13px;
    color:#8b95a5;
    font-weight:400;
}
.box{
    background:#ffffff;
    border:1px solid #eceef2;
    border-radius:14px;
    box-shadow:0 2px 10px rgba(23,43,77,.06);
    padding:6px;
    margin-bottom:18px;
}
textarea{
    width:100%;
    height:150px;
    border:0;
    border-radius:10px;
    padding:12px 12px;
    resize:none;
    font-family:"Consolas","Menlo","Courier New",monospace;
    font-size:12.5px;
    line-height:1.75;
    color:#20293a;
    outline:none;
    background:transparent;
    word-break:break-all;
}
textarea::placeholder{color:#aab3c0}
textarea::-webkit-scrollbar{width:8px}
textarea::-webkit-scrollbar-thumb{
    background:#c9ced8;
    border-radius:8px;
}
textarea::-webkit-scrollbar-track{background:transparent}
button{
    width:100%;
    border:0;
    height:54px;
    border-radius:12px;
    cursor:pointer;
    font-size:16px;
    font-weight:700;
    font-family:inherit;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    transition:filter .18s ease, background .18s ease;
}
button svg{width:19px;height:19px}
.primary{
    background:linear-gradient(90deg,#3550e8,#8b3ff0);
    color:#fff;
    box-shadow:0 6px 16px rgba(78,63,232,.28);
}
.primary:hover{filter:brightness(1.08)}
.secondary{
    background:#e8f1fe;
    color:#2f6fe4;
    margin-top:12px;
}
.secondary:hover{background:#dbe9fd}
#status{
    margin-top:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    font-size:14px;
    font-weight:500;
    color:#16a34a;
    min-height:20px;
}
#status svg{width:16px;height:16px;flex:0 0 16px}
.footer{
    margin-top:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    font-size:12.5px;
    color:#9aa3b0;
}
.footer svg{width:16px;height:16px}
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="lg" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
          <stop stop-color="#3550E8"/>
          <stop offset="1" stop-color="#8B3FF0"/>
        </linearGradient>
      </defs>
      <path d="M10 13.2a4.2 4.2 0 0 0 6.34.46l2.5-2.5a4.2 4.2 0 0 0-5.94-5.94l-1.43 1.43" stroke="url(#lg)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M14 10.8a4.2 4.2 0 0 0-6.34-.46l-2.5 2.5a4.2 4.2 0 0 0 5.94 5.94l1.42-1.42" stroke="url(#lg)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <div>
    <h1>Link Tools</h1>
    <p class="subtitle">Open &amp; copy browser links</p>
  </div>
</div>

<div class="box">
  <textarea id="links" spellcheck="false" placeholder="Paste links here...
Supports:
https://
file:///C:/PDFs/file.pdf"></textarea>
</div>

<button class="primary" id="open">
  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M10 13.2a4.2 4.2 0 0 0 6.34.46l2.5-2.5a4.2 4.2 0 0 0-5.94-5.94l-1.43 1.43" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M14 10.8a4.2 4.2 0 0 0-6.34-.46l-2.5 2.5a4.2 4.2 0 0 0 5.94 5.94l1.42-1.42" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  Open Links
</button>

<button class="secondary" id="copy">
  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M10 13.2a4.2 4.2 0 0 0 6.34.46l2.5-2.5a4.2 4.2 0 0 0-5.94-5.94l-1.43 1.43" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M14 10.8a4.2 4.2 0 0 0-6.34-.46l-2.5 2.5a4.2 4.2 0 0 0 5.94 5.94l1.42-1.42" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  Copy Open Links
</button>

<div id="status"></div>

<div class="footer">
  <span>Chrome + Edge compatible</span>
</div>

<script src="popup.js"></script>
</body>
</html>
